[project]
name = "backend"
version = "0.1.0"
description = "HTTP API for phishing URL analysis (ML model + rules ensemble)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "scikit-learn==1.9.1",
    "joblib>=1.6.0",
    "pandas>=2.2.0",
    "tldextract>=5.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
