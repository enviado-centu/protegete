<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Protegete — Demo: escaneá un QR</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1b1f1c;
    --muted: #52605a;
    --border: #d7ded9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.5rem 3rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #ffffff;
  }
  header {
    max-width: 900px;
    margin: 0 auto 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 0.5rem;
  }
  p.lead {
    font-size: 1.125rem;
    color: var(--muted);
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
  }
  figure {
    margin: 0;
    padding: 1.5rem;
    border: 2px solid var(--border);
    border-radius: 20px;
    text-align: center;
    page-break-inside: avoid;
  }
  figure img {
    width: 100%;
    max-width: 320px;
    height: auto;
    image-rendering: pixelated;
  }
  figcaption {
    margin-top: 1rem;
    font-size: 1.375rem;
    font-weight: 700;
  }
  footer {
    max-width: 900px;
    margin: 2.5rem auto 0;
    font-size: 1rem;
    color: var(--muted);
    text-align: center;
  }
  @media print {
    body { padding: 0.5in; }
    footer { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Escaneá un código QR</h1>
    <p class="lead">
      Abrí Protegete en tu celular y escaneá cada código con la cámara (o
      subí una foto). Mirá qué te dice sobre cada uno.
    </p>
  </header>

  <div class="grid">
    <figure>
      <img src="qr-1.png" alt="Código QR 1" />
      <figcaption>QR 1</figcaption>
    </figure>
    <figure>
      <img src="qr-2.png" alt="Código QR 2" />
      <figcaption>QR 2</figcaption>
    </figure>
    <figure>
      <img src="qr-3.png" alt="Código QR 3" />
      <figcaption>QR 3</figcaption>
    </figure>
  </div>

  <footer>
    Protegete — demo para jurado. Página para imprimir o mostrar en pantalla.
  </footer>
</body>
</html>
